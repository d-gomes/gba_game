<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokemon Style Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
  <div class="map">
    <div class="path"></div>

    <!-- Houses -->
    <div class="house" style="top:50px; left:50px;">
      <div class="roof"></div>
      <div class="body">
        <div class="door"></div>
        <div class="window left"></div>
        <div class="window right"></div>
      </div>
    </div>

    <div class="house" style="top:50px; left:200px;">
      <div class="roof"></div>
      <div class="body">
        <div class="door"></div>
        <div class="window left"></div>
        <div class="window right"></div>
      </div>
    </div>

    <div class="house" style="top:50px; left:350px;">
      <div class="roof"></div>
      <div class="body">
        <div class="door"></div>
        <div class="window left"></div>
        <div class="window right"></div>
      </div>
    </div>

    <!-- Player -->
    <div id="player" class="player"></div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
